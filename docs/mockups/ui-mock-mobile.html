<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Web CAD - UI整え案（現状ベース）</title>
<style>
  /* ===== 現行の配色をほぼ踏襲しつつ微調整 ===== */
  :root{
    --bg:#212830; --panel:#333842; --panel-2:#2a2e35; --border:#181c21;
    --text:#e0e0e0; --dim:#9aa3ad; --accent:#528bff; --green:#00ff88;
    --cyan:#00ffff; --yellow:#ffcc00; --warn:#ff6b6b;
    --tap:40px;
    font-size:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;
    font-family:"Segoe UI","Hiragino Kaku Gothic ProN",sans-serif;
    background:#000;color:var(--text);user-select:none;-webkit-user-select:none;}

  /* スマホ枠（デモ用） */
  #phone{position:relative;width:414px;height:896px;margin:0 auto;background:var(--bg);
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 0 1px var(--border);}

  /* ============================================================
     通常モード（現状の上部バー＋左ツールバーを「整えた」版）
     主な整え点:
       ・上部バーは折返し→横1行スクロール（全ボタン維持）
       ・ボタン高さ/余白を統一しタップしやすく(36-40px)
       ・control-group をカード化し境界を明確に
       ・配色/角丸/コントラストを統一
     ============================================================ */
  #normal{display:flex;flex-direction:column;height:100%;}

  /* 上部バー：横スクロール1行 */
  #topbar{flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:8px;padding:7px 8px;overflow-x:auto;
    scrollbar-width:none;}
  #topbar::-webkit-scrollbar{display:none;}
  .tbtn{flex:0 0 auto;height:36px;min-width:36px;padding:0 12px;background:transparent;
    border:1px solid #555;border-radius:8px;color:var(--text);font-size:13px;
    display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;}
  .tbtn:active{background:rgba(255,255,255,.1);}
  .tbtn.primary{border-color:var(--green);color:var(--green);}
  .cgroup{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--panel-2);
    border:1px solid #3a4049;border-radius:10px;padding:5px 8px;}
  .cgroup .lab{color:var(--dim);font-size:11px;}
  .cgroup select{height:30px;background:#1e2227;color:#fff;border:1px solid #555;
    border-radius:6px;padding:0 6px;font-size:12px;max-width:96px;}

  /* ステータスバー（整え：高さ/間隔統一） */
  #statusbar{flex-shrink:0;height:34px;background:var(--panel);
    border-bottom:1px solid var(--border);display:flex;align-items:center;
    justify-content:space-between;padding:0 10px;gap:8px;}
  #statusbar .left{display:flex;align-items:center;gap:8px;}
  .sbtn{height:26px;padding:0 10px;background:transparent;border:1px solid transparent;
    border-radius:7px;color:var(--dim);font-size:12px;font-weight:600;cursor:pointer;}
  .sbtn.on{color:var(--green);border-color:var(--green);}
  .sbtn.on-blue{color:var(--accent);border-color:var(--accent);}
  #coords{font-family:Consolas,monospace;font-size:12px;color:var(--text);}

  /* 中央：左ツールバー＋キャンバス（現状の縦ツールバーを維持） */
  #mid{flex:1;display:flex;min-height:0;}
  #toolbar{width:60px;flex-shrink:0;background:var(--panel);
    border-right:1px solid var(--border);display:flex;flex-direction:column;
    align-items:center;gap:4px;padding:6px 0;overflow-y:auto;scrollbar-width:none;}
  #toolbar::-webkit-scrollbar{display:none;}
  .tool{width:52px;height:50px;background:transparent;border:1px solid transparent;
    border-radius:9px;color:var(--text);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;cursor:pointer;flex-shrink:0;}
  .tool:active{background:rgba(255,255,255,.08);}
  .tool.active{background:rgba(82,139,255,.22);border-color:var(--accent);}
  .tool .ic{font-size:19px;font-weight:bold;line-height:1;}
  .tool .nm{font-size:9px;color:var(--dim);}
  .tool.active .nm{color:var(--accent);}
  .tsep{width:70%;height:1px;background:#444;margin:3px 0;}
  #canvas-wrap{flex:1;position:relative;background:#000;min-width:0;}
  #cvN{display:block;width:100%;height:100%;}

  /* 下部コマンドライン（現状維持・高さのみ微調整） */
  #cmdarea{flex-shrink:0;height:96px;background:var(--bg);border-top:1px solid var(--border);
    display:flex;flex-direction:column;font-family:Consolas,monospace;font-size:12px;}
  #cmdlog{flex:1;padding:6px 10px;overflow:auto;color:var(--dim);line-height:1.6;
    display:flex;flex-direction:column;justify-content:flex-end;}
  #cmdrow{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#fff;}
  #cmdrow .pr{color:#333;font-weight:700;}
  #cmdrow input{flex:1;border:none;outline:none;font-size:15px;font-family:inherit;font-weight:600;}

  /* ============================================================
     座標読取モード（現状の要素配置を維持して整えた版）
     ============================================================ */
  #reader{display:none;position:absolute;inset:0;background:#000;}
  #reader.show{display:block;}
  #cvR{display:block;width:100%;height:100%;}
  /* 上部ステータス（細バー） */
  #r-top{position:absolute;top:0;left:0;right:0;height:34px;display:flex;align-items:center;
    justify-content:space-between;padding:0 8px;
    background:linear-gradient(180deg,rgba(33,40,48,.9),rgba(33,40,48,0));}
  #r-top .left{display:flex;align-items:center;gap:6px;}
  #r-top .ucs{color:var(--accent);font-weight:700;font-size:13px;}
  #r-top .sp{color:var(--dim);font-size:11px;}
  #r-top .right{display:flex;align-items:center;gap:8px;}
  #r-top .coord{font-family:Consolas,monospace;font-size:12px;color:var(--green);}
  /* 座標ツールチップ（拡大して視認性UP） */
  #r-tip{position:absolute;top:38%;left:52%;background:rgba(0,0,0,.82);
    border:1px solid rgba(0,255,0,.6);border-radius:8px;padding:8px 12px;
    font-family:Consolas,monospace;font-size:15px;color:var(--green);line-height:1.5;
    box-shadow:0 2px 10px rgba(0,0,0,.6);}
  #r-tip .snap{display:block;color:var(--yellow);font-size:11px;margin-top:2px;}
  /* 左下ズーム（整え：丸ボタン/間隔統一） */
  #r-zoom{position:absolute;left:12px;bottom:16px;display:flex;flex-direction:column;
    align-items:center;gap:6px;background:rgba(40,44,52,.9);border:1px solid rgba(255,255,255,.18);
    border-radius:26px;padding:8px 5px;backdrop-filter:blur(6px);}
  #r-zoom button{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.25);
    background:transparent;color:var(--text);font-size:20px;font-weight:bold;cursor:pointer;}
  #r-zoom input{-webkit-appearance:none;appearance:none;width:34px;height:130px;
    background:rgba(255,255,255,.12);border-radius:17px;-webkit-writing-mode:vertical-lr;writing-mode:vertical-lr;}
  #r-zoom input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
    border-radius:50%;background:var(--accent);border:2px solid #fff;cursor:pointer;}
  /* 右下FAB（整え：サイズ統一/間隔） */
  #r-fabs{position:absolute;right:12px;bottom:16px;display:flex;flex-direction:column;gap:10px;}
  .rfab{width:50px;height:50px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);
    background:rgba(40,44,52,.9);color:var(--text);font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.5);
    backdrop-filter:blur(6px);}
  .rfab:active{transform:scale(.92);}
  .rfab.on{border-color:var(--green);color:var(--green);}
  .rfab.exit{border-color:var(--warn);color:var(--warn);}
  /* 右ドロワー（整え：ボタンサイズ/余白を統一、丸み統一） */
  #r-drawer{position:absolute;top:42px;right:0;display:flex;align-items:flex-start;
    transition:transform .3s cubic-bezier(.25,1,.5,1);z-index:5;}
  #r-drawer.closed{transform:translateX(calc(100% - 34px));}
  #r-handle{align-self:flex-start;background:rgba(30,34,40,.92);color:#fff;
    border:1px solid rgba(255,255,255,.2);border-right:none;border-radius:10px 0 0 10px;
    padding:16px 9px;cursor:pointer;font-size:13px;box-shadow:-4px 0 12px rgba(0,0,0,.5);}
  #r-tools{display:flex;flex-direction:column;gap:10px;padding:0 10px 14px 8px;
    background:rgba(20,22,26,.65);border-radius:0 0 0 12px;backdrop-filter:blur(6px);
    max-height:calc(896px - 60px);overflow-y:auto;scrollbar-width:none;}
  #r-tools::-webkit-scrollbar{display:none;}
  .rgrp{background:rgba(30,34,40,.9);border:1px solid rgba(255,255,255,.15);
    border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;
    box-shadow:0 4px 12px rgba(0,0,0,.5);margin-top:10px;}
  .rbtn{min-height:38px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:600;
    background:rgba(40,44,52,.95);color:var(--text);border:1px solid #666;cursor:pointer;
    white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:5px;}
  .rbtn.g{color:var(--green);border-color:var(--green);}
  .rbtn.y{color:var(--yellow);border-color:var(--yellow);}
  .rbtn.b{color:var(--accent);border-color:var(--accent);}
  .rbtn.r{color:var(--warn);border-color:#666;}
  .rrow{display:flex;gap:8px;}
  .rrow .rbtn{flex:1;padding:0 6px;font-size:12px;}
  .rsel{min-height:38px;border-radius:10px;background:rgba(40,44,52,.95);color:#fff;
    border:1px solid #666;padding:0 8px;font-size:13px;}

  /* デモ用切替バー（実機には無し） */
  #demobar{position:fixed;top:50%;left:16px;transform:translateY(-50%);z-index:200;
    display:flex;flex-direction:column;gap:6px;background:#000c;padding:6px;border-radius:10px;}
  #demobar button{font-size:12px;padding:7px 11px;border-radius:8px;border:1px solid #444;
    background:#1a2029;color:#ccc;cursor:pointer;}
  #demobar button.sel{background:var(--accent);border-color:var(--accent);color:#fff;}
  #demonote{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);z-index:200;
    color:#667;font-size:11px;}
</style>
</head>
<body>

<div id="demobar">
  <button id="db-n" class="sel" onclick="showView('normal')">通常モード（整え版）</button>
  <button id="db-r" onclick="showView('reader')">座標読取モード（整え版）</button>
</div>

<div id="phone">

  <!-- ========== 通常モード ========== -->
  <div id="normal">
    <div id="topbar">
      <button class="tbtn">📁 開く</button>
      <button class="tbtn">✕ 閉じる</button>
      <button class="tbtn">📋 プロパティ</button>
      <div class="cgroup"><span class="lab">保存</span>
        <button class="tbtn primary" style="height:30px;padding:0 8px;">💾</button>
        <button class="tbtn" style="height:30px;padding:0 8px;">📂</button>
        <button class="tbtn" style="height:30px;padding:0 8px;">DXF</button>
        <button class="tbtn" style="height:30px;padding:0 8px;">DWG</button>
      </div>
      <div class="cgroup"><span class="lab">編集</span>
        <button class="tbtn" style="height:30px;padding:0 8px;">↩</button>
        <button class="tbtn" style="height:30px;padding:0 8px;">↪</button>
      </div>
      <div class="cgroup"><span class="lab">座標系</span>
        <span style="color:var(--accent);font-weight:700;font-size:12px;">WCS</span>
        <select><option>UCS--</option></select>
        <button class="tbtn" style="height:30px;padding:0 8px;">🧭PLAN</button>
        <button class="tbtn" style="height:30px;padding:0 8px;">原点移動</button>
        <button class="tbtn" style="height:30px;padding:0 8px;">2点</button>
      </div>
      <div class="cgroup"><span class="lab">画層</span>
        <span style="width:13px;height:13px;background:#fff;border-radius:3px;"></span>
        <select><option>0</option></select>
        <button class="tbtn" style="height:30px;padding:0 8px;">👁️</button>
        <button class="tbtn" style="height:30px;padding:0 8px;color:var(--yellow);border-color:#665;">🚫</button>
      </div>
      <button class="tbtn">🔍 原点</button>
      <button class="tbtn">🔍 全体</button>
      <button class="tbtn primary" onclick="showView('reader')">🎯 座標読取</button>
    </div>

    <div id="statusbar">
      <div class="left">
        <span class="ucs" style="color:var(--accent);font-weight:700;font-size:12px;">WCS</span>
        <span style="color:var(--dim);font-size:11px;">モデル</span>
      </div>
      <div class="left">
        <button class="sbtn">範囲選択</button>
        <button class="sbtn on-blue">ORTHO</button>
        <button class="sbtn on">OSNAP ▾</button>
        <span id="coords">1240.50, 865.25</span>
      </div>
    </div>

    <div id="mid">
      <div id="toolbar">
        <button class="tool active"><span class="ic">／</span><span class="nm">LINE</span></button>
        <button class="tool"><span class="ic">∧</span><span class="nm">PLINE</span></button>
        <button class="tool"><span class="ic">▭</span><span class="nm">RECT</span></button>
        <button class="tool"><span class="ic">◯</span><span class="nm">CIRCLE</span></button>
        <button class="tool"><span class="ic">⌒</span><span class="nm">ARC</span></button>
        <button class="tool"><span class="ic">⬭</span><span class="nm">ELLIP</span></button>
        <button class="tool"><span class="ic">A</span><span class="nm">TEXT</span></button>
        <button class="tool"><span class="ic">▦</span><span class="nm">HATCH</span></button>
        <div class="tsep"></div>
        <button class="tool"><span class="ic" style="color:var(--warn)">✖</span><span class="nm">ERASE</span></button>
        <button class="tool"><span class="ic" style="color:var(--yellow)">✥</span><span class="nm">MOVE</span></button>
        <button class="tool"><span class="ic" style="color:var(--yellow)">⧉</span><span class="nm">COPY</span></button>
        <button class="tool"><span class="ic" style="color:var(--yellow)">◫</span><span class="nm">OFFSET</span></button>
        <button class="tool"><span class="ic" style="color:var(--yellow)">↻</span><span class="nm">ROTATE</span></button>
        <div class="tsep"></div>
        <button class="tool"><span class="ic" style="color:var(--cyan)">↔</span><span class="nm">DIMLIN</span></button>
        <button class="tool"><span class="ic" style="color:var(--cyan)">⤢</span><span class="nm">DIMALN</span></button>
        <button class="tool"><span class="ic" style="color:var(--cyan)">R</span><span class="nm">DIMRAD</span></button>
        <button class="tool"><span class="ic" style="color:var(--cyan)">⌀</span><span class="nm">DIMDIA</span></button>
        <button class="tool"><span class="ic" style="color:var(--cyan)">∠</span><span class="nm">DIMANG</span></button>
        <button class="tool"><span class="ic" style="color:var(--cyan)">XY</span><span class="nm">DIMORD</span></button>
      </div>
      <div id="canvas-wrap"><canvas id="cvN"></canvas></div>
    </div>

    <div id="cmdarea">
      <div id="cmdlog">
        <div>Web CADシステム v2.0 初期化完了。</div>
        <div>・作図: LINE(L), CIRCLE(C), RECTANG(REC), ARC(A), PLINE(PL)</div>
        <div style="color:var(--green)">コマンド: LINE</div>
        <div>1点目を指定:</div>
      </div>
      <div id="cmdrow"><span class="pr">コマンド:</span><input placeholder="コマンド入力"></div>
    </div>
  </div>

  <!-- ========== 座標読取モード ========== -->
  <div id="reader">
    <canvas id="cvR"></canvas>
    <div id="r-top">
      <div class="left"><span class="ucs">WCS</span><span class="sp">モデル</span></div>
      <div class="right">
        <button class="sbtn">範囲選択</button>
        <button class="sbtn on-blue" style="border:1px solid var(--accent)">ORTHO</button>
        <button class="sbtn on" style="border:1px solid var(--green)">OSNAP ▾</button>
        <span class="coord">X:1240 Y:865</span>
      </div>
    </div>

    <div id="r-tip">X: 1240.500<br>Y: 865.250<span class="snap">◇ 端点スナップ</span></div>

    <div id="r-zoom">
      <button>＋</button>
      <input type="range" min="-30" max="30" value="0">
      <button>－</button>
    </div>

    <div id="r-fabs">
      <button class="rfab on" title="OSNAP">⊕</button>
      <button class="rfab on" title="座標常時表示">XY</button>
      <button class="rfab" title="全体表示">⛶</button>
      <button class="rfab exit" onclick="showView('normal')" title="解除">✕</button>
    </div>

    <div id="r-drawer" class="closed">
      <button id="r-handle" onclick="document.getElementById('r-drawer').classList.toggle('closed')">◀</button>
      <div id="r-tools">
        <div class="rgrp">
          <button class="rbtn g">📍 座標</button>
          <button class="rbtn y">📏 連続寸法</button>
        </div>
        <div class="rgrp">
          <button class="rbtn">🎯 UCS</button>
          <button class="rbtn">📈 2点</button>
          <button class="rbtn b">🧭 PLAN</button>
          <button class="rbtn">↩ WCS</button>
          <select class="rsel"><option>-- UCS読込 --</option></select>
          <select class="rsel"><option>-- 画層 --</option></select>
          <div class="rrow">
            <button class="rbtn g">👁️ 画層管理</button>
            <button class="rbtn y">🚫 タッチ消去</button>
          </div>
          <div class="rrow">
            <button class="rbtn">💾 保存</button>
            <button class="rbtn r">🗑️ 消去</button>
          </div>
        </div>
        <div class="rgrp">
          <button class="rbtn g">💾 図面保存</button>
          <button class="rbtn b">📂 復元</button>
        </div>
      </div>
    </div>
  </div>

</div>

<div id="demonote">※ デザイン確認用モック（実機では枠・上部デモバー無し／全画面）。現状の構造を維持して整えています。</div>

<script>
  function showView(v){
    document.getElementById('normal').style.display = v==='normal'?'flex':'none';
    document.getElementById('reader').classList.toggle('show', v==='reader');
    document.getElementById('db-n').classList.toggle('sel', v==='normal');
    document.getElementById('db-r').classList.toggle('sel', v==='reader');
    setTimeout(drawAll,30);
  }

  function drawCAD(cv, opt){
    if(!cv) return;
    const ctx=cv.getContext('2d');
    const r=cv.getBoundingClientRect();const dpr=devicePixelRatio||1;
    if(r.width===0) return;
    cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    const W=r.width,H=r.height;const ox=W*0.42,oy=H*0.52;
    ctx.fillStyle=opt.bg;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;
    for(let x=ox%40;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=oy%40;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    ctx.strokeStyle='#cdd6df';ctx.lineWidth=1.4;
    ctx.strokeRect(ox+30,oy-150,160,110);
    ctx.beginPath();ctx.arc(ox+110,oy-95,28,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='#00ffff';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(ox+30,oy-170);ctx.lineTo(ox+190,oy-170);ctx.stroke();
    ctx.fillStyle='#00ffff';ctx.font='11px monospace';ctx.fillText('1600',ox+95,oy-175);
    ctx.strokeStyle='#e0483a';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(0,oy);ctx.lineTo(W,oy);ctx.stroke();
    ctx.strokeStyle='#3ac06a';
    ctx.beginPath();ctx.moveTo(ox,0);ctx.lineTo(ox,H);ctx.stroke();
    ctx.strokeStyle='#528bff';ctx.lineWidth=1.5;ctx.strokeRect(ox-7,oy-7,14,14);
    ctx.fillStyle='#528bff';ctx.font='10px monospace';ctx.fillText('WCS',ox+10,oy+16);
    const cx=W*0.55,cy=H*0.4;ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,H);ctx.moveTo(0,cy);ctx.lineTo(W,cy);ctx.stroke();
    ctx.strokeStyle='#00ff88';ctx.lineWidth=2;ctx.strokeRect(cx-9,cy-9,18,18);
  }
  function drawAll(){
    drawCAD(document.getElementById('cvN'),{bg:'#000'});
    drawCAD(document.getElementById('cvR'),{bg:'#000'});
  }
  drawAll();addEventListener('resize',drawAll);setTimeout(drawAll,60);
</script>
</body>
</html>
