# プッシュ・プルリクエストごとに「lint → 自動テスト → 本番ビルド」を実行する。
# ここが失敗した版は、Vercel に自動デプロイされる前に GitHub 上で気付ける。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: lint（構文・未定義変数のチェック）
        run: npm run lint

      - name: 自動テスト（取り込み・幾何・スナップ・トリム/延長・保存・固有ID）
        run: npm test

      - name: 品質のチェック G1（見えない文字・版番号・テストの件数）
        run: npm run quality

      - name: 本番ビルド
        run: npm run build

      - name: 秘密の文字の検査（API キー・token・秘密の鍵がソース・設定・ビルドに無いか）
        run: npm run secrets

      - name: 画面のチェック G2（本物の Chrome で、幅 × ボタンの大きさ × 動き の見た目と指の操作）
        run: npm run ui-gate
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: 画面のチェックの画像（失敗したときに見る）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-gate-screens
          path: .quality/ui/

      - name: ビルド結果の確認（Service Worker にビルドIDが入っているか）
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          ! grep -q "__WEBCAD_" dist/sw.js
          grep -q 'name="webcad-build"' dist/index.html
